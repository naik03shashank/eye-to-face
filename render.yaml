services:
  - type: web
    name: eye-to-face
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
